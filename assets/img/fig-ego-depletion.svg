<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="A paradigm, replicated to zero">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">A PARADIGM, REPLICATED TO ZERO</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Ego depletion across four generations of studies</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<text x="300" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="1.6">EFFECT SIZE (d) FOR THE SAME DEPLETION PARADIGM</text><text x="286" y="163.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Hagger et al., 2010</text><rect x="300" y="140" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="140" width="735.1" height="34" fill="#d3a95f" opacity=".85"/><text x="1045.1428571428573" y="163.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">0.62</text><text x="286" y="215.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Carter et al., 2015</text><rect x="300" y="192" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="192" width="237.1" height="34" fill="#8f723c" opacity=".85"/><text x="547.1428571428571" y="215.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">0.20</text><text x="286" y="267.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Hagger, 2016 (23 labs)</text><rect x="300" y="244" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="244" width="47.4" height="34" fill="#7d9ec4" opacity=".85"/><text x="357.42857142857144" y="267.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">0.04</text><text x="286" y="319.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Vohs et al., 2021 (36 labs)</text><rect x="300" y="296" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="296" width="2.0" height="34" fill="#c96a5a" opacity=".85"/><text x="312" y="319.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">0.00</text><text x="44" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The effect did not survive pre-registered multi-lab replication. This is what that looks like.</text>
</svg>
