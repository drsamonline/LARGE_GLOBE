<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="The K–Pg boundary">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">THE K–PG BOUNDARY</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">What a centimetre of clay contains</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="120" y="130" width="319" height="230" fill="rgba(211,169,95,.16)" stroke="rgba(233,227,213,.12)"/><text x="279.6" y="120" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#e9e3d5" text-anchor="middle" font-weight="400" letter-spacing="0">Maastrichtian</text><text x="279.6" y="384" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">ammonites, non-avian dinosaurs</text><rect x="439" y="130" width="61" height="230" fill="rgba(201,106,90,.45)" stroke="rgba(233,227,213,.12)"/><text x="469.6" y="120" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#e9e3d5" text-anchor="middle" font-weight="400" letter-spacing="0">Iridium clay</text><text x="469.6" y="384" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">worldwide, centimetres thick</text><rect x="500" y="130" width="380" height="230" fill="rgba(127,174,122,.16)" stroke="rgba(233,227,213,.12)"/><text x="690.0" y="120" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#e9e3d5" text-anchor="middle" font-weight="400" letter-spacing="0">Danian</text><text x="690.0" y="384" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">mammals, birds, ferns first</text><text x="44" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="2">SPECIES</text><text x="44" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="2">LOST</text><text x="44" y="250" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">~75%</text><text x="900" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">Ir anomaly</text><line x1="898" y1="204" x2="520" y2="200" stroke="#c96a5a" stroke-width="1" stroke-dasharray="3 3"/><text x="900" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Shocked quartz</text><text x="900" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Melt spherules</text><text x="900" y="294" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Tsunami deposit</text><text x="44" y="424" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The boundary is abrupt in the highest-resolution marine records. The Deccan eruptions bracket it on both sides.</text>
</svg>
