<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Four positions, one question">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">FOUR POSITIONS, ONE QUESTION</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Where experience enters the picture</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="90" y="140" width="490" height="106" fill="rgba(233,227,213,.03)" stroke="#8b8477" stroke-opacity=".55"/><text x="112" y="178" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Physicalism</text><text x="112" y="206" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">experience emerges from structure</text><text x="112" y="228" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6a5f" text-anchor="start" font-weight="400" letter-spacing="0">testable prediction: yes</text><rect x="620" y="140" width="490" height="106" fill="rgba(233,227,213,.03)" stroke="#d3a95f" stroke-opacity=".55"/><text x="642" y="178" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">Panpsychism</text><text x="642" y="206" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">experience is fundamental and ubiquitous</text><text x="642" y="228" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6a5f" text-anchor="start" font-weight="400" letter-spacing="0">testable prediction: none</text><rect x="90" y="270" width="490" height="106" fill="rgba(233,227,213,.03)" stroke="#7d9ec4" stroke-opacity=".55"/><text x="112" y="308" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">Dualism</text><text x="112" y="336" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">experience is a separate substance</text><text x="112" y="358" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6a5f" text-anchor="start" font-weight="400" letter-spacing="0">testable prediction: none</text><rect x="620" y="270" width="490" height="106" fill="rgba(233,227,213,.03)" stroke="#8f723c" stroke-opacity=".55"/><text x="642" y="308" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#8f723c" text-anchor="start" font-weight="400" letter-spacing="0">Idealism</text><text x="642" y="336" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">experience is all there is</text><text x="642" y="358" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6a5f" text-anchor="start" font-weight="400" letter-spacing="0">testable prediction: none</text><text x="44" y="420" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The question that sorts them: is experience derivable from physical structure?</text>
</svg>
