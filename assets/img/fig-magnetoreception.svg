<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="How a cell could measure a field">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">HOW A CELL COULD MEASURE A FIELD</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">The candidate mechanisms and their status</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="60" y="132" width="340" height="230" fill="rgba(233,227,213,.03)" stroke="#d3a95f" stroke-opacity=".45"/><text x="80" y="168" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">Radical pair</text><text x="80" y="194" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">cryptochrome 4 in the retina</text><text x="80" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">light-dependent; demonstrated in vitro, 2021</text><rect x="80" y="330" width="86" height="22" fill="#d3a95f" opacity=".2"/><text x="123" y="345" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#d3a95f" text-anchor="middle" font-weight="400" letter-spacing="1.4">STRONG</text><rect x="440" y="132" width="340" height="230" fill="rgba(233,227,213,.03)" stroke="#c96a5a" stroke-opacity=".45"/><text x="460" y="168" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">Magnetite</text><text x="460" y="194" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">iron-oxide crystals coupled to nerves</text><text x="460" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">crystals found; the beak cells were macrophages</text><rect x="460" y="330" width="86" height="22" fill="#c96a5a" opacity=".2"/><text x="503" y="345" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#c96a5a" text-anchor="middle" font-weight="400" letter-spacing="1.4">WEAK</text><rect x="820" y="132" width="340" height="230" fill="rgba(233,227,213,.03)" stroke="#7d9ec4" stroke-opacity=".45"/><text x="840" y="168" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">Induction</text><text x="840" y="194" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">swimming through seawater's field</text><text x="840" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">plausible in sharks and rays only</text><rect x="840" y="330" width="86" height="22" fill="#7d9ec4" opacity=".2"/><text x="883" y="345" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#7d9ec4" text-anchor="middle" font-weight="400" letter-spacing="1.4">PARTIAL</text><text x="44" y="410" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Three mechanisms, three different evidential standings. Behaviour is settled; the transducer is not.</text>
</svg>
