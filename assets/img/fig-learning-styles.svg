<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="The test learning styles never passed">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">THE TEST LEARNING STYLES NEVER PASSED</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">A crossover effect, predicted and not found</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<text x="44" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="2">IF THE THEORY WERE TRUE</text><rect x="44" y="146" width="470" height="200" fill="rgba(233,227,213,.03)" stroke="rgba(233,227,213,.10)"/><path d="M84 320 L474 200" stroke="#d3a95f" stroke-width="2.4"/><path d="M84 200 L474 320" stroke="#7d9ec4" stroke-width="2.4"/><text x="84" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">visual lesson</text><text x="400" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">auditory lesson</text><text x="258" y="168" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#d3a95f" text-anchor="middle" font-weight="400" letter-spacing="0">crossing = a real interaction</text><text x="690" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="2">WHAT THE STUDIES FIND</text><rect x="690" y="146" width="470" height="200" fill="rgba(233,227,213,.03)" stroke="rgba(233,227,213,.10)"/><path d="M730 262 L1120 258" stroke="#d3a95f" stroke-width="2.4"/><path d="M730 268 L1120 266" stroke="#7d9ec4" stroke-width="2.4"/><text x="730" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">visual lesson</text><text x="1046" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">auditory lesson</text><text x="925" y="168" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">no interaction, no crossover</text><text x="44" y="410" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The meshing hypothesis predicts the left panel. Twenty years of tests that met its own design</text><text x="44" y="432" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">requirements produced the right panel.</text>
</svg>
