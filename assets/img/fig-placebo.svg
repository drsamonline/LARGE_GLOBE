<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Where the placebo effect lives">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">WHERE THE PLACEBO EFFECT LIVES</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Large on what you report, small on what a machine measures</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<text x="300" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="1.6">PLACEBO RESPONSE AS A SHARE OF THE ACTIVE-TREATMENT RESPONSE</text><text x="286" y="153.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Pain intensity</text><rect x="300" y="134" width="830" height="28" fill="rgba(233,227,213,.035)"/><rect x="300" y="134" width="514.6" height="28" fill="#d3a95f" opacity=".85"/><text x="824.6" y="153.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">62%</text><text x="286" y="193.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Nausea</text><rect x="300" y="174" width="830" height="28" fill="rgba(233,227,213,.035)"/><rect x="300" y="174" width="456.5" height="28" fill="#d3a95f" opacity=".85"/><text x="766.5" y="193.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">55%</text><text x="286" y="233.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Depression score</text><rect x="300" y="214" width="830" height="28" fill="rgba(233,227,213,.035)"/><rect x="300" y="214" width="398.4" height="28" fill="#d3a95f" opacity=".85"/><text x="708.4" y="233.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">48%</text><text x="286" y="273.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Asthma: reported</text><rect x="300" y="254" width="830" height="28" fill="rgba(233,227,213,.035)"/><rect x="300" y="254" width="365.2" height="28" fill="#d3a95f" opacity=".85"/><text x="675.2" y="273.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">44%</text><text x="286" y="313.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Asthma: FEV₁</text><rect x="300" y="294" width="830" height="28" fill="rgba(233,227,213,.035)"/><rect x="300" y="294" width="49.8" height="28" fill="#7d9ec4" opacity=".85"/><text x="359.8" y="313.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">6%</text><text x="286" y="353.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Infection</text><rect x="300" y="334" width="830" height="28" fill="rgba(233,227,213,.035)"/><rect x="300" y="334" width="24.9" height="28" fill="#7d9ec4" opacity=".85"/><text x="334.9" y="353.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">3%</text><text x="286" y="393.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Tumour size</text><rect x="300" y="374" width="830" height="28" fill="rgba(233,227,213,.035)"/><rect x="300" y="374" width="16.6" height="28" fill="#7d9ec4" opacity=".85"/><text x="326.6" y="393.04" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">2%</text><text x="44" y="420" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Subjective symptoms move; measured physiology mostly does not. The split is the finding.</text>
</svg>
