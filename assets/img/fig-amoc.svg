<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="The Atlantic overturning">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">THE ATLANTIC OVERTURNING</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">One loop, two branches, and a short record</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="110" y="130" width="980" height="250" fill="rgba(125,158,196,.05)" stroke="rgba(125,158,196,.25)"/><text x="130" y="160" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="2">NORTH</text><text x="1070" y="160" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="2">SOUTH</text><path d="M150 200 C 400 190, 700 190, 1040 176" stroke="#d3a95f" stroke-width="3" fill="none" marker-end="url(#m2)"/><path d="M1040 320 C 700 330, 400 330, 150 316" stroke="#7d9ec4" stroke-width="3" fill="none"/><defs><marker id="m2" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#d3a95f"/></marker></defs><text x="600" y="176" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#d3a95f" text-anchor="middle" font-weight="400" letter-spacing="0">warm surface flow, cooling as it goes</text><text x="600" y="356" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7d9ec4" text-anchor="middle" font-weight="400" letter-spacing="0">cold, salty return flow at depth</text><path d="M980 220 L980 296" stroke="#8b8477" stroke-width="1.4" stroke-dasharray="3 3"/><text x="994" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">sinking</text><text x="44" y="410" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Heat carried north, released, water sinks and returns. The measurement problem is that</text><text x="44" y="432" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">the array that watches this has only been in the water since 2004.</text>
</svg>
