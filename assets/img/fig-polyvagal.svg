<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Three states, one ladder">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">THREE STATES, ONE LADDER</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">What the theory asserts, and what physiology supports</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="70" y="132" width="480" height="80" fill="rgba(233,227,213,.03)" stroke="#7fae7a" stroke-opacity=".5"/><text x="94" y="166" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#7fae7a" text-anchor="start" font-weight="400" letter-spacing="0">Ventral vagal</text><text x="94" y="192" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">safe, social, engaged</text><text x="600" y="166" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">myelinated pathway claimed as mammalian-only</text><text x="600" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6a5f" text-anchor="start" font-weight="400" letter-spacing="0">status: disputed anatomy</text><rect x="70" y="226" width="480" height="80" fill="rgba(233,227,213,.03)" stroke="#d3a95f" stroke-opacity=".5"/><text x="94" y="260" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">Sympathetic</text><text x="94" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">mobilised: fight or flight</text><text x="600" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">accepted physiology, not distinctive to the theory</text><text x="600" y="284" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6a5f" text-anchor="start" font-weight="400" letter-spacing="0">status: accepted</text><rect x="70" y="320" width="480" height="80" fill="rgba(233,227,213,.03)" stroke="#c96a5a" stroke-opacity=".5"/><text x="94" y="354" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">Dorsal vagal</text><text x="94" y="380" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">shutdown, immobilised</text><text x="600" y="354" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">unmyelinated pathway claimed as ancestral</text><text x="600" y="378" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6a5f" text-anchor="start" font-weight="400" letter-spacing="0">status: disputed anatomy</text><text x="44" y="430" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The hierarchy is the claim. The states are real; the ladder and the evolutionary story are not established.</text>
</svg>
