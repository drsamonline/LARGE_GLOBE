<text x="435" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">Consequence</text>
<text x="435" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Tissue function declines</text>
<path d="M602 158 L614 158" stroke="#c8a45c" stroke-width="1.5"/>
