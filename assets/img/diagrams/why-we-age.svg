<text x="38" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">Damage</text>
<text x="38" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">DNA, proteins and</text>
<text x="38" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">membranes accumulate</text>
<text x="38" y="170" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">faults</text>
