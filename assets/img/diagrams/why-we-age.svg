<text x="236" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">Response</text>
<text x="236" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Senescent cells,</text>
<text x="236" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">inflammation, stem-cell</text>
<text x="236" y="170" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">exhaustion</text>
