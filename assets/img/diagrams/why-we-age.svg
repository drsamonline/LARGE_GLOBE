<text x="634" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">The claim being</text>
<text x="634" y="136" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">tested</text>
<text x="634" y="158" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Intervening in each</text>
<text x="634" y="173" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">hallmark extends healthy</text>
<text x="634" y="188" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">life</text>
