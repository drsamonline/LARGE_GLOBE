<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-label="Theories of dreaming">
<rect width="820" height="400" fill="#12171c"/>
<text x="22" y="40" fill="#e8e6e1" font-family="Georgia,serif" font-size="19">Theories of dreaming</text>
<rect x="22" y="66" width="300" height="64" rx="8" fill="#0d1116" stroke="#2a3138"/>
<rect x="22" y="66" width="4" height="64" fill="#6ea8b5"/>
<text x="38" y="90" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">Dreaming occurs mostly in REM</text>
<text x="38" y="107" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">sleep</text>
<text x="38" y="124" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Established by awakening studies</text>
<rect x="498" y="96" width="300" height="74" rx="8" fill="#0d1116" stroke="#2a3138"/>
<rect x="498" y="96" width="4" height="74" fill="#6ea8b5"/>
<text x="514" y="120" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="13.5" font-weight="600">Measured</text>
<text x="514" y="136" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">REM physiology; replay of waking activity in</text>
<text x="514" y="150" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">animals</text>
<path d="M330 98 C410.0 98 410.0 133 490 133" stroke="#6ea8b5" stroke-width="1.2" fill="none" opacity=".7"/>
<rect x="498" y="184" width="300" height="74" rx="8" fill="#0d1116" stroke="#2a3138"/>
<rect x="498" y="184" width="4" height="74" fill="#6ea8b5"/>
<text x="514" y="208" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="13.5" font-weight="600">Argued</text>
<text x="514" y="224" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Threat rehearsal; emotional processing</text>
<path d="M330 98 C410.0 98 410.0 221 490 221" stroke="#6ea8b5" stroke-width="1.2" fill="none" opacity=".7"/>
<rect x="498" y="272" width="300" height="74" rx="8" fill="#0d1116" stroke="#2a3138"/>
<rect x="498" y="272" width="4" height="74" fill="#6ea8b5"/>
<text x="514" y="296" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="13.5" font-weight="600">Not established</text>
<text x="514" y="312" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">That dreams have a single function</text>
<path d="M330 98 C410.0 98 410.0 309 490 309" stroke="#6ea8b5" stroke-width="1.2" fill="none" opacity=".7"/>
