<text x="634" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">The aftermath</text>
<text x="634" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Agents convicted; France</text>
<text x="634" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">admitted responsibility</text>
