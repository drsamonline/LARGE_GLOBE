<rect x="220" y="92" width="180" height="132" rx="8" fill="#0d1116" stroke="#2a3138"/>
<rect x="220" y="92" width="4" height="132" fill="#c8a45c"/>
<text x="236" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">The operation</text>
<text x="236" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Two limpet mines placed</text>
<text x="236" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">by French agents</text>
<path d="M403 158 L415 158" stroke="#c8a45c" stroke-width="1.5"/>
<path d="M415 158 l-5 -3.5 v7 z" fill="#c8a45c"/>
