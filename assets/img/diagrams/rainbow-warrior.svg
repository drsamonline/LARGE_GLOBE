<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="The Rainbow Warrior sinking, in sequence">
<rect width="820" height="300" fill="#12171c"/>
<text x="22" y="40" fill="#e8e6e1" font-family="Georgia,serif" font-size="19">The Rainbow Warrior sinking, in sequence</text>
