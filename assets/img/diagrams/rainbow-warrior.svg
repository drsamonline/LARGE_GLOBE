<rect x="22" y="92" width="4" height="132" fill="#c8a45c"/>
<text x="38" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">1985</text>
<text x="38" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">The ship is in Auckland</text>
<text x="38" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">harbour, bound for</text>
<text x="38" y="170" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Moruroa</text>
<path d="M204 158 L216 158" stroke="#c8a45c" stroke-width="1.5"/>
