<rect x="419" y="92" width="4" height="132" fill="#c8a45c"/>
<text x="435" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">The outcome</text>
<text x="435" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">One photographer killed;</text>
<text x="435" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">the ship sunk</text>
<path d="M602 158 L614 158" stroke="#c8a45c" stroke-width="1.5"/>
<path d="M614 158 l-5 -3.5 v7 z" fill="#c8a45c"/>
<rect x="618" y="92" width="180" height="132" rx="8" fill="#0d1116" stroke="#2a3138"/>
