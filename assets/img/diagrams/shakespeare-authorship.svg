<text x="38" y="107" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Did the actor from Stratford write the</text>
<text x="38" y="121" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">plays?</text>
