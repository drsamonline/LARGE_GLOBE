<text x="38" y="90" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">Sleep is universal and costly</text>
<text x="38" y="107" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">So it must do something</text>
<rect x="498" y="96" width="300" height="74" rx="8" fill="#0d1116" stroke="#2a3138"/>
