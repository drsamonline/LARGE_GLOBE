<text x="514" y="296" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="13.5" font-weight="600">Weaker evidence</text>
<text x="514" y="312" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Immune function; energy conservation</text>
