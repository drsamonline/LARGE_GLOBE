<text x="514" y="208" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="13.5" font-weight="600">Strong evidence</text>
<text x="514" y="224" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Metabolic clearance in the brain</text>
<path d="M330 98 C410.0 98 410.0 221 490 221" stroke="#6ea8b5" stroke-width="1.2" fill="none" opacity=".7"/>
<rect x="498" y="272" width="300" height="74" rx="8" fill="#0d1116" stroke="#2a3138"/>
