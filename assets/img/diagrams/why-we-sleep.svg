<text x="514" y="120" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="13.5" font-weight="600">Strong evidence</text>
<text x="514" y="136" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Memory consolidation; synaptic</text>
<text x="514" y="150" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">renormalisation</text>
<path d="M330 98 C410.0 98 410.0 133 490 133" stroke="#6ea8b5" stroke-width="1.2" fill="none" opacity=".7"/>
<rect x="498" y="184" width="300" height="74" rx="8" fill="#0d1116" stroke="#2a3138"/>
