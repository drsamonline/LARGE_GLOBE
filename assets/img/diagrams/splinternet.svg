<text x="38" y="158" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">One network, common</text>
<text x="38" y="173" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">protocols, no borders</text>
