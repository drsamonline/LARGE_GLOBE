<text x="435" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">The consequence</text>
<text x="435" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Services differ by</text>
<text x="435" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">country; standards</text>
<text x="435" y="170" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">fragment</text>
