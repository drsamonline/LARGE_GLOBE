<text x="634" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">Documented and</text>
<text x="634" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">continuing</text>
