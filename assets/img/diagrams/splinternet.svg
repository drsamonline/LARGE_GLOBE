<text x="236" y="118" fill="#e8e6e1" font-family="Helvetica,Arial" font-size="14" font-weight="600">The divergence</text>
<text x="236" y="140" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">National firewalls, data</text>
<text x="236" y="155" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">localisation, platform</text>
<text x="236" y="170" fill="#9aa3ad" font-family="Helvetica,Arial" font-size="11.5">bans</text>
