<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="One claim, four measurements">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">ONE CLAIM, FOUR MEASUREMENTS</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Effect sizes from the growth-mindset literature</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<text x="300" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="1.6">STANDARDISED EFFECT SIZE (d), SAME CLAIM AT FOUR SCALES</text><text x="286" y="163.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Original studies, 2006–2012</text><rect x="300" y="140" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="140" width="756.2" height="34" fill="#d3a95f" opacity=".85"/><text x="1066.2222222222222" y="163.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">0.41</text><text x="286" y="215.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Meta-analysis, 2018 (129 studies)</text><rect x="300" y="192" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="192" width="147.6" height="34" fill="#8f723c" opacity=".85"/><text x="457.55555555555554" y="215.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">0.08</text><text x="286" y="267.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">National RCT, 2019 (~12,000 pupils)</text><rect x="300" y="244" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="244" width="36.9" height="34" fill="#7d9ec4" opacity=".85"/><text x="346.8888888888889" y="267.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">0.02</text><text x="286" y="319.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Subgroup: low attainers, 2019</text><rect x="300" y="296" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="296" width="184.4" height="34" fill="#7fae7a" opacity=".85"/><text x="494.44444444444446" y="319.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7fae7a" text-anchor="start" font-weight="400" letter-spacing="0">0.10</text><text x="44" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Effects shrink as the sample grows. The claim is not that mindset does nothing;</text><text x="44" y="422" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">it is that the size of the thing was set by the smallest studies.</text>
</svg>
