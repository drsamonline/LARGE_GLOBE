<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="A dispersion sweep">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">A DISPERSION SWEEP</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Frequency against arrival time for a single burst</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="140" y="145" width="900" height="215" fill="rgba(233,227,213,.03)" stroke="rgba(233,227,213,.10)"/><text x="128" y="157" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="0">high</text><text x="128" y="360" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="0">low</text><text x="128" y="252.5" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="0">frequency</text><text x="590.0" y="392" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">arrival time →</text><path d="M180 155 L260 205 L350 253 L460 297 L590 331 L740 353 L920 367" stroke="#d3a95f" stroke-width="3" fill="none"/><circle cx="180" cy="155" r="5" fill="#e9e3d5"/><text x="194" y="163" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">the burst itself: a few milliseconds</text><text x="610" y="205" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">delay ∝ electrons along the line of sight</text><text x="610" y="227" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">= a distance measurement, free</text><text x="44" y="432" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">One pulse, swept across frequency by the plasma it crossed. That sweep is why FRBs can weigh the cosmos.</text>
</svg>
