<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="A galaxy that spins too fast">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">A GALAXY THAT SPINS TOO FAST</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Rotation curve against the prediction from luminous mass</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="130" y="140" width="940" height="220" fill="rgba(233,227,213,.03)" stroke="rgba(233,227,213,.10)"/><text x="130" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">rotation speed →</text><text x="1070" y="388" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="0">distance from centre →</text><path d="M150 340 C 300 200, 500 176, 1050 186" stroke="#d3a95f" stroke-width="2.6" fill="none"/><path d="M150 340 C 300 210, 420 300, 1050 344" stroke="#7d9ec4" stroke-width="2.4" stroke-dasharray="6 5" fill="none"/><text x="760" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">observed: flat</text><text x="700" y="336" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">expected from visible mass</text><text x="44" y="412" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The curve should fall. It does not. That gap is the entire case for dark matter —</text><text x="44" y="434" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">and the reason MOND exists as a rival.</text>
</svg>
