<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Two rulers, two answers">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">TWO RULERS, TWO ANSWERS</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">The Hubble constant, as measured two ways</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<line x1="120" y1="230" x2="1120" y2="230" stroke="rgba(233,227,213,.25)"/><line x1="120" y1="230" x2="120" y2="238" stroke="#8b8477"/><text x="120.0" y="258" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">64</text><line x1="453" y1="230" x2="453" y2="238" stroke="#8b8477"/><text x="453.3333333333333" y="258" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">68</text><line x1="787" y1="230" x2="787" y2="238" stroke="#8b8477"/><text x="786.6666666666666" y="258" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">72</text><line x1="1120" y1="230" x2="1120" y2="238" stroke="#8b8477"/><text x="1120.0" y="258" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">76</text><text x="1120" y="282" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="0">H₀, km s⁻¹ Mpc⁻¹</text><rect x="377" y="196" width="52" height="34" fill="#7d9ec4" opacity=".55"/><text x="403.3333333333338" y="182" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7d9ec4" text-anchor="middle" font-weight="400" letter-spacing="0">Planck 67.4 ± 0.5</text><rect x="844" y="196" width="52" height="34" fill="#d3a95f" opacity=".55"/><text x="870.0" y="182" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#d3a95f" text-anchor="middle" font-weight="400" letter-spacing="0">SH0ES 73.0 ± 1.0</text><text x="44" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The gap is five sigma. Either one measurement is wrong in a way nobody has found,</text><text x="44" y="422" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">or the cosmological model is missing something.</text>
</svg>
