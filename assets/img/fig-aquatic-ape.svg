<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="What the hypothesis has to beat">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">WHAT THE HYPOTHESIS HAS TO BEAT</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Each aquatic explanation against the terrestrial one</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<text x="44" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="2">TRAIT</text><text x="360" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="2">AQUATIC EXPLANATION</text><text x="700" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="2">TERRESTRIAL EXPLANATION ALREADY AVAILABLE</text><line x1="44" y1="158" x2="1156" y2="158" stroke="rgba(233,227,213,.07)"/><text x="44" y="146" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">Body hair loss</text><text x="360" y="146" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">streamlining in water</text><text x="700" y="146" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">thermoregulation; sexual selection</text><line x1="44" y1="202" x2="1156" y2="202" stroke="rgba(233,227,213,.07)"/><text x="44" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">Subcutaneous fat</text><text x="360" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">insulation, buoyancy</text><text x="700" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">shared with many land mammals</text><line x1="44" y1="246" x2="1156" y2="246" stroke="rgba(233,227,213,.07)"/><text x="44" y="234" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">Bipedalism</text><text x="360" y="234" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">wading</text><text x="700" y="234" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">woodland locomotion, ~6 Ma</text><line x1="44" y1="290" x2="1156" y2="290" stroke="rgba(233,227,213,.07)"/><text x="44" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">Breath control</text><text x="360" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">diving</text><text x="700" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">speech, singing, tool use</text><line x1="44" y1="334" x2="1156" y2="334" stroke="rgba(233,227,213,.07)"/><text x="44" y="322" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e9e3d5" text-anchor="start" font-weight="400" letter-spacing="0">Diving reflex</text><text x="360" y="322" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">aquatic life</text><text x="700" y="322" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">present in all mammals, stronger in divers</text><text x="44" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">Five traits, five terrestrial accounts. A hypothesis that is not needed to explain the</text><text x="44" y="422" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">evidence is not refuted by that alone — but it stops being the simpler explanation.</text>
</svg>
