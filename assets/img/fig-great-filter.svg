<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Where the filter sits">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">WHERE THE FILTER SITS</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Three placements, one absence of data</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<line x1="90" y1="250" x2="1130" y2="250" stroke="rgba(233,227,213,.25)"/><text x="90" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">simple life</text><text x="600" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">intelligence</text><text x="1130" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="0">visible civilisation</text><rect x="192" y="196" width="116" height="54" fill="rgba(201,106,90,.18)" stroke="#c96a5a" stroke-dasharray="4 4"/><text x="250" y="180" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#c96a5a" text-anchor="middle" font-weight="400" letter-spacing="0">behind us</text><text x="250" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">life was hard to start</text><rect x="562" y="196" width="116" height="54" fill="rgba(201,106,90,.18)" stroke="#c96a5a" stroke-dasharray="4 4"/><text x="620" y="180" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#c96a5a" text-anchor="middle" font-weight="400" letter-spacing="0">ahead of us</text><text x="620" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">minds are rare</text><rect x="902" y="196" width="116" height="54" fill="rgba(201,106,90,.18)" stroke="#c96a5a" stroke-dasharray="4 4"/><text x="960" y="180" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#c96a5a" text-anchor="middle" font-weight="400" letter-spacing="0">just ahead</text><text x="960" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">expansion is rare</text><text x="44" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">The filter is somewhere. The three placements are observationally identical so far,</text><text x="44" y="422" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">which is why the argument is about priors, not evidence.</text>
</svg>
