<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="The one law turbulence obeys">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">THE ONE LAW TURBULENCE OBEYS</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">The energy cascade, as measured</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="140" y="140" width="900" height="220" fill="rgba(233,227,213,.03)" stroke="rgba(233,227,213,.10)"/><text x="140" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">energy in eddies (log) →</text><text x="1040" y="388" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="end" font-weight="400" letter-spacing="0">eddy wavenumber (log) →</text><path d="M180 170 L760 330" stroke="#d3a95f" stroke-width="2.6"/><path d="M760 330 L1000 350" stroke="#7d9ec4" stroke-width="2.2" stroke-dasharray="5 4"/><text x="430" y="214" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">−5/3 slope</text><text x="770" y="322" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="0">viscous cutoff</text><text x="44" y="412" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">One straight line over three decades of scale, in every turbulent flow measured.</text><text x="44" y="434" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">No one can derive it from the equations.</text>
</svg>
