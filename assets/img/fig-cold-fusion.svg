<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="The replication ledger, 1989–2019">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">THE REPLICATION LEDGER, 1989–2019</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">Heat without the by-products it requires</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<text x="300" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="1.6">CLAIMED, AS A FRACTION OF WHAT THE CLAIMED HEAT REQUIRES</text><text x="286" y="163.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Excess heat</text><rect x="300" y="140" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="140" width="788.5" height="34" fill="#d3a95f" opacity=".85"/><text x="1098.5" y="163.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d3a95f" text-anchor="start" font-weight="400" letter-spacing="0">95%</text><text x="306" y="163.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#12151d" text-anchor="start" font-weight="400" letter-spacing="0">reported</text><text x="286" y="215.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Neutrons</text><rect x="300" y="192" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="192" width="24.9" height="34" fill="#c96a5a" opacity=".85"/><text x="334.9" y="215.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">3%</text><text x="286" y="267.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Tritium</text><rect x="300" y="244" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="244" width="99.6" height="34" fill="#c96a5a" opacity=".85"/><text x="409.6" y="267.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">12%</text><text x="286" y="319.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="end" font-weight="400" letter-spacing="0">Helium-4</text><rect x="300" y="296" width="830" height="34" fill="rgba(233,227,213,.035)"/><rect x="300" y="296" width="74.7" height="34" fill="#c96a5a" opacity=".85"/><text x="384.7" y="319.12" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c96a5a" text-anchor="start" font-weight="400" letter-spacing="0">9%</text><text x="44" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">A nuclear heat source fixes the ratio between heat and by-products. Measured ratios came out</text><text x="44" y="422" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">three orders of magnitude apart — which is why the result was a calorimetry problem, not a discovery.</text>
</svg>
