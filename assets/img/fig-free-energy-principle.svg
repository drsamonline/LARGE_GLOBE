<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="The Markov blanket">
<rect width="1200" height="460" fill="#141a26"/>
<text x="44" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.6" fill="#8b8477">THE MARKOV BLANKET</text>
<text x="44" y="70" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9e3d5">The only diagram the formalism actually needs</text>
<line x1="44" y1="86" x2="1156" y2="86" stroke="rgba(211,169,95,.28)"/>
<rect x="70" y="130" width="1060" height="250" fill="rgba(125,158,196,.06)" stroke="rgba(125,158,196,.35)"/><text x="96" y="160" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7d9ec4" text-anchor="start" font-weight="400" letter-spacing="1.6">ENVIRONMENT — everything outside the blanket</text><rect x="330" y="200" width="540" height="150" fill="#141a26" stroke="#d3a95f"/><rect x="370" y="232" width="200" height="86" fill="rgba(211,169,95,.14)" stroke="#8f723c"/><text x="470" y="268" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="middle" font-weight="400" letter-spacing="0">internal states</text><text x="470" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">(the model)</text><rect x="630" y="232" width="200" height="86" fill="rgba(233,227,213,.05)" stroke="rgba(233,227,213,.25)"/><text x="730" y="268" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e9e3d5" text-anchor="middle" font-weight="400" letter-spacing="0">active states</text><text x="730" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b8477" text-anchor="middle" font-weight="400" letter-spacing="0">(action on the world)</text><text x="600" y="196" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#d3a95f" text-anchor="middle" font-weight="400" letter-spacing="0">sensory states — the blanket</text><path d="M600 350 L600 400" stroke="#d3a95f" stroke-width="1.6" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#d3a95f"/></marker></defs><text x="614" y="402" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b8477" text-anchor="start" font-weight="400" letter-spacing="0">the system persists by keeping its states in a narrow band</text>
</svg>
