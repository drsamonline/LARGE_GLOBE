# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# This file is intentionally tiny: the whole pipeline lives in the public
# app-builder kit, so a fix there reaches every app at once. It used to be a
# 4.9 kB hand-copied workflow, and the copies drifted - one of them kept
# `if: always()` on the release job, which DELETED the published release before
# recreating it, so a failed build destroyed the release. Do not inline it again.
#
# What it does on every push to main:
#   build the portable EXE and the signed APK -> publish the rolling `app-latest`
#   release -> deploy the demo to Pages. All three come from the same commit, so
#   the live demo and the released build can never disagree.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@85949b5b7ef6a47a40731cc01e8c2cd65ceeda4c   # was @main
    with:
      app_name: LARGE_GLOBE
      app_src: docs/play
      # No Pages deploy from this workflow.
      #
      # Two things were wrong with it. It failed on every run — "No artifacts named
      # github-pages were found" — because the build job never uploads that artifact.
      # And it could not have been right even if it had: Pages for this repository
      # serves the archive from the repository root, so deploying docs/ would have
      # replaced 1,038 dossiers with a landing page.
      #
      # The archive owns Pages. If the demo should be published, give it its own
      # repository or its own Pages project; do not point it at this one.
      deploy_path: ""    # empty = do not deploy; the archive owns Pages
    permissions:
      contents: write
      # granted because the called workflow declares them; a caller cannot grant
      # fewer permissions than the callee requires, and the run dies at startup
      # with no log if it tries
      pages: write
      id-token: write
      actions: write    # the shot job dispatches the run that publishes its picture
