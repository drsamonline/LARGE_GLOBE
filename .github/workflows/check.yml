name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # Mondays, 04:00 UTC

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the feed and the changelog read git history for dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal links, images, and page invariants
        run: python tools/check-structure.py
      - name: Landing page, demo, robots and sitemaps
        run: python tools/check-docs.py
      - name: Size budget
        run: python tools/check-size.py
      - name: Shared shell is in step with index.html
        run: python tools/rebuild-shell.py --check
      - name: charts.html is in step with the ledger
        run: python tools/rebuild-charts.py --check
      - name: EPUB structure
        run: python tools/check-epub.py
      - name: Feed lists current entries
        run: python tools/build-feed.py --check
      - name: Stylesheet hash is current on every page
        run: python tools/stamp-css.py --check
      - name: Sitemap lists every page
        run: python tools/build-sitemap.py --check
      - name: README numbers match the repository
        run: python tools/update-readme.py --check
      - name: Arithmetic claims in the mathematics dossiers
        run: |
          pip install --quiet sympy
          python tools/check-math.py
      - name: Images, credits and counts agree
        run: |
          pip install --quiet pillow
          python tools/check-images.py

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every cited URL still answers
        run: python tools/check-links.py --report dead-links.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dead-links
          path: dead-links.md
